
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egyptian-legal-rag"
version = "0.1.0"
description = "Production-oriented Arabic/English Egyptian Civil Code RAG system"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "chromadb>=0.6,<1",
  "sentence-transformers>=3.4,<6",
  "numpy>=1.26,<3",
  "httpx>=0.27,<1",
  "mlflow>=2.20,<4",
  "dvc>=3.50,<4",
  "ragas==0.2.15",
  "datasets>=3.2,<4",
  "langfuse>=2.57,<4",
  "presidio-analyzer>=2.2,<3",
  "prometheus-client>=0.21,<1",
  "evidently>=0.7,<1",
  "bentoml>=1.4,<2",
  "pymupdf>=1.25,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "locust>=2.32,<3",
  "scikit-learn>=1.6,<2",
  "pandas>=2.2,<3",
  "torch>=2.5,<3",
  "transformers>=4.48,<5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
